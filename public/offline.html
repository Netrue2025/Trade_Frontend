<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071A16" />
    <title>NetrueFi Offline</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Avenir Next", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #071A16;
        color: #FFFFFF;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 30% 15%, rgba(0, 199, 129, 0.18), transparent 18rem),
          linear-gradient(180deg, #071A16, #102C25);
      }
      main {
        width: min(390px, 100%);
        display: grid;
        gap: 18px;
        padding: 24px;
        border: 1px solid #1D4035;
        border-radius: 28px;
        background: #12352B;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        text-align: center;
      }
      img {
        width: 84px;
        height: 84px;
        margin: 0 auto;
        border-radius: 24px;
        box-shadow: 0 0 28px rgba(0, 199, 129, 0.28);
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: 0;
      }
      p {
        margin: 0;
        color: #94A3B8;
        line-height: 1.5;
      }
      button {
        min-height: 48px;
        border: 0;
        border-radius: 16px;
        background: #00C781;
        color: #071A16;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="NetrueFi" />
      <h1>You're offline</h1>
      <p>NetrueFi needs an internet connection for live balances, trading and transactions.</p>
      <p>Your financial data has not been changed.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
