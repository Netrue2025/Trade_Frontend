services:
  - type: web
    name: trade-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: public
    envVars:
      - key: TRADE_API_BASE_URL
        value: https://tradebackend-production-8530.up.railway.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
